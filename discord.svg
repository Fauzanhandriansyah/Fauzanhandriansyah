<svg xmlns="http://www.w3.org/2000/svg" width="260" height="78" viewBox="0 0 260 78" role="img" aria-label="DISCORD">
  <defs>
    <!-- Background Gradient (Discord Dark Theme Base) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0b0e"/>
      <stop offset="55%"  stop-color="#111217"/>
      <stop offset="100%" stop-color="#161722"/>
    </linearGradient>

    <!-- Neon Edge Gradient (Blurple to Cyan) -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5865F2"/>
      <stop offset="50%"  stop-color="#00aff4"/>
      <stop offset="100%" stop-color="#5865F2"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>

    <clipPath id="clip">
      <rect x="1.5" y="1.5" width="257" height="75" rx="12"/>
    </clipPath>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="13" height="13" patternUnits="userSpaceOnUse">
      <path d="M13 0H0V13" fill="none" stroke="#5865F2" stroke-width="0.4" opacity="0.07"/>
    </pattern>

    <!-- Traveling Light Sweep -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5865F2" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#00aff4" stop-opacity="0.16"/>
      <stop offset="55%"  stop-color="#fff"    stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Body -->
  <rect x="1.5" y="1.5" width="257" height="75" rx="12" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="257" height="75" rx="12" fill="url(#grid)"/>

  <!-- Glowing Edge -->
  <g filter="url(#glow)">
    <rect x="1.5" y="1.5" width="257" height="75" rx="12"
          fill="none" stroke="url(#edge)" stroke-width="1.5" opacity="0.9">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.4s"
               begin="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Travelling Light Sweep Animation -->
  <g clip-path="url(#clip)">
    <rect x="-260" y="0" width="260" height="78" fill="url(#sweep)">
      <animate attributeName="x" from="-260" to="260" dur="4.2s"
               begin="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#5865F2" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M10 20V13a3 3 0 0 1 3-3h7"/>
    <path d="M250 20V13a3 3 0 0 0-3-3h-7"/>
    <path d="M10 58v7a3 3 0 0 0 3 3h7"/>
    <path d="M250 58v7a3 3 0 0 1-3 3h-7"/>
  </g>

  <!-- Discord Clyde Icon (Glow & Main) -->
  <g transform="translate(24, 28) scale(0.95)">
    <g filter="url(#soft)" opacity="0.7">
      <path d="M22,3.7C20.3,2.9,18.5,2.4,16.6,2.1c-0.2,0.4-0.5,0.9-0.7,1.4C13.9,3.2,11.9,3.2,9.9,3.5C9.7,3,9.4,2.5,9.2,2.1 C7.3,2.4,5.5,2.9,3.8,3.7C0.5,8.7-0.4,13.6,0.1,18.4c2.2,1.6,4.3,2.6,6.4,3.3c0.5-0.7,1-1.5,1.4-2.3c-0.8-0.3-1.5-0.7-2.2-1.1 c0.2-0.1,0.4-0.3,0.5-0.4c4-1.9,8.4-1.9,12.4,0c0.2,0.1,0.4,0.3,0.5,0.4c-0.7,0.4-1.4,0.8-2.2,1.1c0.4,0.8,0.9,1.6,1.4,2.3 c2.1-0.6,4.2-1.6,6.4-3.3C22.7,12.9,21.7,8.1,22,3.7z M8.1,15.1c-1.2,0-2.3-1.1-2.3-2.5s1-2.5,2.3-2.5s2.3,1.1,2.3,2.5S9.4,15.1,8.1,15.1z M15.9,15.1c-1.2,0-2.3-1.1-2.3-2.5s1-2.5,2.3-2.5s2.3,1.1,2.3,2.5S17.2,15.1,15.9,15.1z" fill="#5865F2"/>
    </g>
    <path d="M22,3.7C20.3,2.9,18.5,2.4,16.6,2.1c-0.2,0.4-0.5,0.9-0.7,1.4C13.9,3.2,11.9,3.2,9.9,3.5C9.7,3,9.4,2.5,9.2,2.1 C7.3,2.4,5.5,2.9,3.8,3.7C0.5,8.7-0.4,13.6,0.1,18.4c2.2,1.6,4.3,2.6,6.4,3.3c0.5-0.7,1-1.5,1.4-2.3c-0.8-0.3-1.5-0.7-2.2-1.1 c0.2-0.1,0.4-0.3,0.5-0.4c4-1.9,8.4-1.9,12.4,0c0.2,0.1,0.4,0.3,0.5,0.4c-0.7,0.4-1.4,0.8-2.2,1.1c0.4,0.8,0.9,1.6,1.4,2.3 c2.1-0.6,4.2-1.6,6.4-3.3C22.7,12.9,21.7,8.1,22,3.7z M8.1,15.1c-1.2,0-2.3-1.1-2.3-2.5s1-2.5,2.3-2.5s2.3,1.1,2.3,2.5S9.4,15.1,8.1,15.1z M15.9,15.1c-1.2,0-2.3-1.1-2.3-2.5s1-2.5,2.3-2.5s2.3,1.1,2.3,2.5S17.2,15.1,15.9,15.1z" fill="#5865F2"/>
  </g>

  <!-- Label -->
  <text x="66" y="35.0" font-family="'Fira Code','JetBrains Mono',ui-monospace,monospace"
        font-size="14.5" font-weight="700" letter-spacing="2.4" fill="#5865F2">DISCORD</text>

  <!-- Status Line (Discord Online Green) -->
  <g>
    <circle cx="70" cy="52.0" r="2.6" fill="#23a55a">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s"
               begin="1.05s" repeatCount="indefinite"/>
    </circle>
    <text x="79" y="56.0" font-family="'Fira Code',ui-monospace,monospace"
          font-size="9.5" letter-spacing="1.6" fill="#23a55a" opacity="0.85">ONLINE</text>
  </g>

  <!-- Interactive Chevron Arrows -->
  <g stroke="#5865F2" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226 34.0 l5 5 -5 5">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s"
               begin="1.05s" repeatCount="indefinite"/>
    </path>
    <path d="M232 34.0 l5 5 -5 5" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.2s"
               begin="1.3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
